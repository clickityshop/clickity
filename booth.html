<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Clickity Booth</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    .booth { display: grid; grid-template-columns: 1fr 360px; gap: 20px; padding: 20px 0 40px; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }
    .tap {
      font: inherit; text-align: left; background: #fff; border: var(--line); border-radius: var(--radius);
      box-shadow: var(--press); padding: 10px; cursor: pointer; display: grid; gap: 4px;
      transition: transform .06s, box-shadow .06s; position: relative;
    }
    .tap:active { transform: translate(5px,5px); box-shadow: none; }
    .tap svg, .tap img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 12px; }
    .tap strong { font-size: 1.05rem; }
    .tap .n { position: absolute; top: 6px; right: 6px; background: var(--ink); color: #fff; border-radius: 999px; min-width: 28px; height: 28px; display: grid; place-items: center; font-weight: 800; }
    .panel { background: #fff; border: var(--line); border-radius: var(--radius); box-shadow: var(--press); padding: 16px; position: sticky; top: 88px; align-self: start; display: grid; gap: 12px; }
    .panel h2 { margin: 0; }
    .sale-lines { min-height: 60px; }
    .sale-lines div { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 2px dashed #111; }
    .sale-lines button { border: 0; background: none; font: inherit; color: #b3261e; cursor: pointer; font-weight: 700; }
    .big-total { font-size: 2.6rem; font-weight: 800; letter-spacing: -.03em; }
    .cash { display: flex; gap: 8px; flex-wrap: wrap; }
    .change { font-size: 1.2rem; font-weight: 700; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stats span { border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; background: var(--lime); font-weight: 700; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #111; vertical-align: top; }
    details { background: #fff; border: var(--line); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 40px; }
    summary { font-weight: 700; cursor: pointer; }
    @media (max-width: 820px) { .booth { grid-template-columns: 1fr; } .panel { position: static; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="./"><span class="dot"></span>Clickity <small style="font-weight:600;font-size:1rem">booth</small></a>
      <div class="stats" id="stats"></div>
    </div>
  </header>

  <main class="wrap">
    <div class="booth">
      <div class="tiles" id="tiles"></div>

      <aside class="panel">
        <h2>Current sale</h2>
        <label style="display:grid;gap:4px;font-weight:600">Color
          <select id="colorPick" style="font:inherit;padding:8px;border:var(--line);border-radius:12px"></select>
        </label>
        <div class="sale-lines" id="saleLines"></div>
        <div class="big-total" id="saleTotal">$0</div>
        <div>
          <div style="font-weight:600;margin-bottom:6px">Cash given</div>
          <div class="cash" id="cashBtns"></div>
          <div class="change" id="change"></div>
        </div>
        <button class="btn lime" id="complete" style="justify-content:center">Complete sale</button>
        <button class="btn small alt" id="clearSale" style="justify-content:center">Clear</button>
      </aside>
    </div>

    <details id="logBox">
      <summary>Sales log (saved on this device)</summary>
      <p style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn small" id="exportCsv">Download CSV</button>
        <button class="btn small alt" id="emailDay">Email today's summary</button>
        <button class="btn small alt" id="undoLast">Undo last sale</button>
        <button class="btn small alt" id="resetLog">Clear log</button>
      </p>
      <p id="logMsg" class="color-name"></p>
      <table><thead><tr><th>Time</th><th>Items</th><th>Total</th></tr></thead><tbody id="logRows"></tbody></table>
    </details>
  </main>

  <script src="config.js"></script>
  <script src="products.js"></script>
  <script src="assets/art.js"></script>
  <script src="assets/booth.js"></script>
  <script src="assets/release-notes.js"></script>
</body>
</html>
